name: awesome-dev

services:
  workspace:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    command: sleep infinity
    env_file:
      - ../.env
    environment:
      PATH: /usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_ADDR: redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_BASE_URL: http://127.0.0.1:${MINIO_PORT:-9000}
      API_BASE_SERVER: http://127.0.0.1:8080
      OJ_API_BASE_SERVER: http://api:${SERVER_PORT:-8080}/api/v1/oj
      JUDGE_SANDBOX_URL: http://oj-sandbox:8082/executeCode
    volumes:
      - ..:/workspaces/awesomeProject:cached
      - go-mod-cache:/go/pkg/mod
      - web-node-modules:/workspaces/awesomeProject/apps/web/node_modules
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      oj-sandbox:
        condition: service_started
      api:
        condition: service_started
      web:
        condition: service_started
    networks:
      - blog_net

  mysql:
    image: mysql:8.0.37
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --sql_mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
      - --max_connections=500
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-blog}
      MYSQL_USER: ${MYSQL_USER:-blog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-blog123456}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../scripts/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - blog_net

  redis:
    image: redis:7.2.5
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis123456}"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123456}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - blog_net

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123456}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - blog_net

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-blog}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-blog123456}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - blog_net

  elasticsearch:
    build:
      context: ./elasticsearch
      args:
        ES_VERSION: 8.14.3
    image: awesome-elasticsearch-ik:8.14.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 8s
      retries: 20
    networks:
      - blog_net

  api:
    image: golang:1.23-bookworm
    restart: unless-stopped
    working_dir: /app
    command: sh -lc "/usr/local/go/bin/go run ./cmd/api"
    env_file:
      - ../.env
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_BASE_URL: http://127.0.0.1:${MINIO_PORT:-9000}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123456}
      BLOG_BASE_URL: http://api:${SERVER_PORT:-8080}
      BLOG_INTERNAL_AUTH_TOKEN: ${BLOG_INTERNAL_AUTH_TOKEN:-dev-blog-internal-token}
      BLOG_AGENT_PASSWORD: ${OJ_BLOG_AGENT_PASSWORD:-dev-agent-password}
      OJ_RABBITMQ_ENABLED: ${OJ_RABBITMQ_ENABLED:-true}
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-blog}:${RABBITMQ_PASSWORD:-blog123456}@rabbitmq:5672/"
      RABBITMQ_JUDGE_QUEUE: ${RABBITMQ_JUDGE_QUEUE:-oj.judge}
      JUDGE_SANDBOX_TYPE: ${JUDGE_SANDBOX_TYPE:-remote}
      JUDGE_SANDBOX_URL: http://oj-sandbox:8082/executeCode
      JUDGE_AUTH_SECRET: ${JUDGE_AUTH_SECRET:-secretKey}
    volumes:
      - ../kkg-backend:/app
      - go-mod-cache:/go/pkg/mod
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      oj-sandbox:
        condition: service_started
    networks:
      - blog_net

  web:
    image: node:20-bookworm
    restart: unless-stopped
    working_dir: /app
    command: sh -lc "npm install && npm run dev"
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-/blog-api}
      API_BASE_SERVER: http://api:${SERVER_PORT:-8080}
      NEXT_PUBLIC_OJ_API_BASE: ${NEXT_PUBLIC_OJ_API_BASE:-/blog-api/api/v1/oj}
      OJ_API_BASE_SERVER: http://api:${SERVER_PORT:-8080}/api/v1/oj
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../apps/web:/app
      - web-node-modules:/app/node_modules
    ports:
      - "${WEB_PORT:-3001}:3001"
    depends_on:
      api:
        condition: service_started
    networks:
      - blog_net

  oj-sandbox:
    build:
      context: ../kkg-sandbox
      dockerfile: Dockerfile
    image: kkg-oj-sandbox:dev
    restart: unless-stopped
    working_dir: /app
    user: "0:0"
    read_only: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SANDBOX_WORKDIR:-/private/tmp/kkg-sandbox}:${SANDBOX_WORKDIR:-/private/tmp/kkg-sandbox}
    environment:
      SANDBOX_ADDR: ${SANDBOX_ADDR:-:8082}
      SANDBOX_AUTH_SECRET: ${SANDBOX_AUTH_SECRET:-secretKey}
      SANDBOX_GO_MODE: ${SANDBOX_GO_MODE:-container}
      SANDBOX_RUNNER_IMAGE: ${SANDBOX_RUNNER_IMAGE:-golang:1.23-bookworm}
      SANDBOX_RUNNER_TIMEOUT_SEC: ${SANDBOX_RUNNER_TIMEOUT_SEC:-12}
      SANDBOX_RUNNER_CPUS: ${SANDBOX_RUNNER_CPUS:-1}
      SANDBOX_RUNNER_MEMORY: ${SANDBOX_RUNNER_MEMORY:-256m}
      SANDBOX_RUNNER_PIDS: ${SANDBOX_RUNNER_PIDS:-64}
      SANDBOX_MAX_OUTPUT_BYTES: ${SANDBOX_MAX_OUTPUT_BYTES:-1048576}
      SANDBOX_WORKDIR: ${SANDBOX_WORKDIR:-/private/tmp/kkg-sandbox}
      GOCACHE: /tmp/go-cache
      GOTMPDIR: /tmp
      TMPDIR: /tmp
    tmpfs:
      - /tmp:exec,size=256m,mode=1777
    ports:
      - "${SANDBOX_PORT:-8082}:8082"
    networks:
      - blog_net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - blog_net

networks:
  blog_net:
    driver: bridge

volumes:
  go-mod-cache:
  web-node-modules:
  mysql-data:
  redis-data:
  minio-data:
  rabbitmq-data:
  es-data:
